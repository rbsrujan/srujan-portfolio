<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#cloudBg)"/>

  <!-- Zero-knowledge lattice cryptographic network graphic -->
  <g stroke="#10b981" stroke-opacity="0.1" stroke-width="1.2">
    <polygon points="600,100 850,220 850,520 600,640 350,520 350,220" fill="none"/>
    <polygon points="600,160 780,260 780,480 600,580 420,480 420,260" fill="none"/>
    <polygon points="600,220 710,290 710,450 600,520 490,450 490,290" fill="none"/>
  </g>

  <!-- Node points -->
  <g fill="#10b981">
    <circle cx="600" cy="100" r="8" fill="#34d399"/>
    <circle cx="850" cy="220" r="8" fill="#06b6d4"/>
    <circle cx="850" cy="520" r="8" fill="#3b82f6"/>
    <circle cx="600" cy="640" r="8" fill="#10b981"/>
    <circle cx="350" cy="520" r="8" fill="#6366f1"/>
    <circle cx="350" cy="220" r="8" fill="#a855f7"/>
  </g>

  <!-- Connective laser lines -->
  <g stroke="url(#neonGreen)" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="600" y1="100" x2="600" y2="640"/>
    <line x1="850" y1="220" x2="350" y2="520"/>
    <line x1="350" y1="220" x2="850" y2="520"/>
  </g>

  <g transform="translate(450, 310)">
    <circle cx="150" cy="60" r="85" fill="#042f2e" fill-opacity="0.75" stroke="#10b981" stroke-width="2"/>
    <text x="150" y="52" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">ZK-STARK VERIFIED</text>
    <text x="150" y="78" fill="#f8fafc" font-family="'Syne', sans-serif" font-size="20" font-weight="700" text-anchor="middle">500k+ TPS</text>
  </g>
</svg>

