<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#0f1123"/>
      <stop offset="100%" stop-color="#180e29"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="subtleBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="750" fill="url(#bg)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="800" y1="0" x2="800" y2="750"/>
    <line x1="1000" y1="0" x2="1000" y2="750"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="200" r="280" fill="#a855f7" fill-opacity="0.18" filter="url(#blurFilter)"/>
  <circle cx="350" cy="550" r="240" fill="#6366f1" fill-opacity="0.15" filter="url(#blurFilter)"/>
  <circle cx="650" cy="380" r="160" fill="#ec4899" fill-opacity="0.1" filter="url(#blurFilter)"/>

  <!-- Isometric / 3D Neural Core Visualization -->
  <g transform="translate(600, 380)">
    <!-- Concentric Orbit rings with depth -->
    <ellipse cx="0" cy="0" rx="360" ry="140" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8 6" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="280" ry="110" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" transform="rotate(25)"/>
    <ellipse cx="0" cy="0" rx="200" ry="80" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.7" transform="rotate(-40)"/>
    
    <!-- Central Polyhedral Quantum Core -->
    <polygon points="0,-120 100,-40 100,60 0,130 -100,60 -100,-40" fill="#13152c" stroke="url(#accent)" stroke-width="2.5" fill-opacity="0.8"/>
    <polygon points="0,-120 100,-40 0,0 -100,-40" fill="#2e1065" fill-opacity="0.5" stroke="#a855f7" stroke-width="1"/>
    <polygon points="100,-40 100,60 0,130 0,0" fill="#3b0764" fill-opacity="0.4" stroke="#c084fc" stroke-width="1"/>
    <polygon points="-100,-40 -100,60 0,130 0,0" fill="#1e1b4b" fill-opacity="0.6" stroke="#818cf8" stroke-width="1"/>

    <!-- Inner Core Glow -->
    <circle cx="0" cy="5" r="45" fill="url(#accent)" filter="url(#subtleBlur)" opacity="0.85"/>
    <circle cx="0" cy="5" r="18" fill="#ffffff" opacity="0.95"/>

    <!-- Neural Nodes & Synapses -->
    <g stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6">
      <line x1="0" y1="5" x2="-220" y2="-90"/>
      <line x1="0" y1="5" x2="240" y2="-70"/>
      <line x1="0" y1="5" x2="-260" y2="110"/>
      <line x1="0" y1="5" x2="270" y2="100"/>
      <line x1="0" y1="5" x2="0" y2="-200"/>
      <line x1="0" y1="5" x2="0" y2="190"/>
    </g>

    <circle cx="-220" cy="-90" r="7" fill="#60a5fa"/>
    <circle cx="240" cy="-70" r="8" fill="#ec4899"/>
    <circle cx="-260" cy="110" r="6" fill="#a855f7"/>
    <circle cx="270" cy="100" r="9" fill="#34d399"/>
    <circle cx="0" cy="-200" r="5" fill="#f43f5e"/>
    <circle cx="0" cy="190" r="6" fill="#38bdf8"/>
  </g>

  <!-- Floating HUD Glass Panel -->
  <g transform="translate(80, 80)">
    <rect width="280" height="130" rx="16" fill="#0f172a" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" backdrop-filter="blur(10px)"/>
    <circle cx="30" cy="35" r="5" fill="#10b981"/>
    <text x="46" y="39" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">ENGINE STATUS: ONLINE</text>
    <text x="30" y="72" fill="#f8fafc" font-family="'Syne', sans-serif" font-weight="700" font-size="20">120 FPS Real-time</text>
    <text x="30" y="96" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Raymarching &bull; WebGPU 1.0 &bull; 4K HDR</text>
    <rect x="30" y="108" width="220" height="4" rx="2" fill="#334155"/>
    <rect x="30" y="108" width="180" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <!-- Technical Telemetry Badge Top Right -->
  <g transform="translate(860, 80)">
    <rect width="260" height="110" rx="16" fill="#0f172a" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="24" y="34" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">LATENCY BENCHMARK</text>
    <text x="24" y="66" fill="#f1f5f9" font-family="'Syne', sans-serif" font-size="22" font-weight="700">0.84ms</text>
    <text x="120" y="66" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="13">&darr; 42% v3.2</text>
    <text x="24" y="90" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">SIMD Shader Pipeline Active</text>
  </g>
</svg>

