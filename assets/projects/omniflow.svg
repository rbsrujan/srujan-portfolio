<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05131e"/>
      <stop offset="50%" stop-color="#082032"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glowFlow">
      <feGaussianBlur stdDeviation="25" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#flowBg)"/>

  <!-- Matrix/Grid Pattern -->
  <g stroke="#0ea5e9" stroke-opacity="0.06" stroke-width="1.2">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="150" y1="0" x2="150" y2="750"/>
    <line x1="350" y1="0" x2="350" y2="750"/>
    <line x1="550" y1="0" x2="550" y2="750"/>
    <line x1="750" y1="0" x2="750" y2="750"/>
    <line x1="950" y1="0" x2="950" y2="750"/>
    <line x1="1150" y1="0" x2="1150" y2="750"/>
  </g>

  <!-- Flow Wave Lines -->
  <path d="M0,450 C300,320 450,580 750,420 C1000,280 1100,380 1200,340" fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.6"/>
  <path d="M0,470 C280,340 480,600 770,440 C1020,300 1120,400 1200,360" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.4" stroke-dasharray="6 4"/>

  <!-- Distributed Agent Swarm Nodes -->
  <!-- Central Coordinator Node -->
  <g transform="translate(600, 360)">
    <circle cx="0" cy="0" r="70" fill="#082f49" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="#0c4a6e" stroke="url(#cyanGrad)" stroke-width="2.5" filter="url(#glowFlow)"/>
    <text x="0" y="-8" fill="#e0f2fe" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">ORCHESTRATOR</text>
    <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">ACTIVE &bull; 64 WORKERS</text>
  </g>

  <!-- Satellite Worker Nodes -->
  <!-- Worker 1 -->
  <g transform="translate(320, 220)">
    <line x1="0" y1="0" x2="230" y2="105" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="-60" y="-10" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">AGENT_ALPHA</text>
    <text x="-60" y="12" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Semantic Indexing</text>
    <circle cx="60" cy="-10" r="4" fill="#22c55e"/>
  </g>

  <!-- Worker 2 -->
  <g transform="translate(880, 220)">
    <line x1="0" y1="0" x2="-230" y2="105" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="-60" y="-10" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="11">AGENT_BETA</text>
    <text x="-60" y="12" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Code Verification</text>
    <circle cx="60" cy="-10" r="4" fill="#22c55e"/>
  </g>

  <!-- Worker 3 -->
  <g transform="translate(300, 520)">
    <line x1="0" y1="0" x2="245" y2="-115" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="-60" y="-10" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11">AGENT_GAMMA</text>
    <text x="-60" y="12" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Synthesis &amp; Eval</text>
    <circle cx="60" cy="-10" r="4" fill="#22c55e"/>
  </g>

  <!-- Worker 4 -->
  <g transform="translate(900, 520)">
    <line x1="0" y1="0" x2="-245" y2="-115" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="-60" y="-10" fill="#c4b5fd" font-family="'JetBrains Mono', monospace" font-size="11">AGENT_DELTA</text>
    <text x="-60" y="12" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Dynamic Sharding</text>
    <circle cx="60" cy="-10" r="4" fill="#22c55e"/>
  </g>

  <!-- Stream Metrics Overlay Top Left -->
  <g transform="translate(60, 60)">
    <rect width="250" height="100" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">DISTRIBUTED CONSENSUS</text>
    <text x="20" y="62" fill="#f8fafc" font-family="'Syne', sans-serif" font-size="22" font-weight="700">99.998%</text>
    <text x="20" y="84" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Raft + Gossip Protocol Active</text>
  </g>
</svg>

