<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="avGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="200" fill="#0b0f19"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#avGrad)" stroke-width="3" stroke-dasharray="10 6"/>
  <circle cx="200" cy="200" r="160" fill="url(#avGlow)"/>
  
  <!-- Stylized Geometric Monogram / Cyber Face Mask -->
  <polygon points="200,80 290,140 290,260 200,320 110,260 110,140" fill="#111827" stroke="url(#avGrad)" stroke-width="3"/>
  <path d="M150,170 L200,140 L250,170 L250,230 L200,260 L150,230 Z" fill="#1f2937" stroke="#818cf8" stroke-width="2"/>
  <circle cx="200" cy="200" r="28" fill="url(#avGrad)"/>
  <circle cx="200" cy="200" r="12" fill="#ffffff"/>
  
  <!-- Glowing Eye Visors -->
  <line x1="160" y1="185" x2="190" y2="185" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="185" x2="240" y2="185" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
</svg>

