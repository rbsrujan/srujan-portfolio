<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F7F7F5"/>
  <rect x="20" y="20" width="760" height="460" rx="8" fill="#FFFFFF" stroke="#E5E5E3" stroke-width="1.5"/>
  
  <!-- Window title bar -->
  <rect x="20" y="20" width="760" height="44" rx="8" fill="#E2E8F0"/>
  <circle cx="45" cy="42" r="5" fill="#EF4444"/>
  <circle cx="62" cy="42" r="5" fill="#F59E0B"/>
  <circle cx="79" cy="42" r="5" fill="#10B981"/>
  <text x="100" y="46" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">HAL Engine Division &bull; Service Ticket &amp; Complaint Log System (Tkinter Desktop)</text>

  <g transform="translate(45, 85)">
    <!-- Header banner -->
    <rect width="710" height="45" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="20" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Hindustan Aeronautics Limited (HAL) — Engine Division, Bangalore</text>

    <!-- Ticket Form Panel -->
    <g transform="translate(0, 60)">
      <rect width="340" height="260" rx="6" fill="#FAFAF9" stroke="#E5E5E3"/>
      <text x="20" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#171717">Service Ticket Entry Form</text>
      
      <text x="20" y="58" font-family="sans-serif" font-size="10" fill="#666666">USER / OPERATOR NAME</text>
      <rect x="20" y="66" width="300" height="26" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="28" y="83" font-family="sans-serif" font-size="11" fill="#171717">Maint_Tech_Div3</text>

      <text x="20" y="110" font-family="sans-serif" font-size="10" fill="#666666">ASSIGNED SERVICE ENGINEER</text>
      <rect x="20" y="118" width="300" height="26" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="28" y="135" font-family="sans-serif" font-size="11" fill="#171717">Senior Engineer (Engine Assembly)</text>

      <text x="20" y="162" font-family="sans-serif" font-size="10" fill="#666666">NATURE OF PROBLEM &amp; DOWNTIME</text>
      <rect x="20" y="170" width="300" height="40" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="28" y="188" font-family="sans-serif" font-size="11" fill="#171717">Hydraulic test rig calibration drift (4.2 hrs)</text>

      <rect x="20" y="222" width="140" height="26" rx="4" fill="#0F172A"/>
      <text x="46" y="239" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Submit Ticket</text>
    </g>

    <!-- Log Table Panel -->
    <g transform="translate(360, 60)">
      <rect width="350" height="260" rx="6" fill="#FAFAF9" stroke="#E5E5E3"/>
      <text x="20" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#171717">Relational SQLite Log Buffer</text>

      <rect x="15" y="45" width="320" height="25" fill="#E2E8F0" rx="4 4 0 0"/>
      <text x="25" y="62" font-family="sans-serif" font-size="10" font-weight="600" fill="#334155">ID</text>
      <text x="65" y="62" font-family="sans-serif" font-size="10" font-weight="600" fill="#334155">DEPARTMENT</text>
      <text x="185" y="62" font-family="sans-serif" font-size="10" font-weight="600" fill="#334155">DOWN HRS</text>
      <text x="260" y="62" font-family="sans-serif" font-size="10" font-weight="600" fill="#334155">STATUS</text>

      <line x1="15" y1="105" x2="335" y2="105" stroke="#E5E5E3"/>
      <text x="25" y="93" font-family="sans-serif" font-size="11" fill="#171717">#108</text>
      <text x="65" y="93" font-family="sans-serif" font-size="11" fill="#171717">Assembly Bay 2</text>
      <text x="185" y="93" font-family="sans-serif" font-size="11" fill="#171717">3.5 hrs</text>
      <text x="260" y="93" font-family="sans-serif" font-size="10" font-weight="600" fill="#15803D">Completed</text>

      <line x1="15" y1="145" x2="335" y2="145" stroke="#E5E5E3"/>
      <text x="25" y="133" font-family="sans-serif" font-size="11" fill="#171717">#109</text>
      <text x="65" y="133" font-family="sans-serif" font-size="11" fill="#171717">Testing Cell 4</text>
      <text x="185" y="133" font-family="sans-serif" font-size="11" fill="#171717">1.2 hrs</text>
      <text x="260" y="133" font-family="sans-serif" font-size="10" font-weight="600" fill="#B45309">Pending</text>

      <line x1="15" y1="185" x2="335" y2="185" stroke="#E5E5E3"/>
      <text x="25" y="173" font-family="sans-serif" font-size="11" fill="#171717">#110</text>
      <text x="65" y="173" font-family="sans-serif" font-size="11" fill="#171717">Avionics Bay</text>
      <text x="185" y="173" font-family="sans-serif" font-size="11" fill="#171717">5.0 hrs</text>
      <text x="260" y="173" font-family="sans-serif" font-size="10" font-weight="600" fill="#15803D">Completed</text>

      <rect x="15" y="215" width="320" height="30" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="25" y="234" font-family="sans-serif" font-size="10" fill="#475569">Tech: Python &bull; Tkinter UI &bull; SQLite Relational DB &bull; Pandas</text>
    </g>
  </g>
</svg>

