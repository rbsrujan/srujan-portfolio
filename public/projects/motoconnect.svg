<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F7F7F5"/>
  <rect x="20" y="20" width="760" height="460" rx="8" fill="#FFFFFF" stroke="#E5E5E3" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="760" height="44" rx="8" fill="#F0F0EE"/>
  <circle cx="45" cy="42" r="5" fill="#D1D1CE"/>
  <circle cx="62" cy="42" r="5" fill="#D1D1CE"/>
  <circle cx="79" cy="42" r="5" fill="#D1D1CE"/>
  <text x="100" y="46" font-family="sans-serif" font-size="11" fill="#777777">motoconnect &bull; IoT Telematics &bull; Vehicle Telemetry &amp; Diagnostics</text>

  <g transform="translate(45, 85)">
    <text x="0" y="20" font-family="sans-serif" font-size="16" font-weight="700" fill="#171717">MotoConnect — Connected Vehicle Diagnostic Dashboard</text>
    <text x="0" y="38" font-family="sans-serif" font-size="12" fill="#666666">Real-time CAN-bus sensor telemetry &bull; Trip efficiency analytics &bull; Diagnostic Trouble Codes</text>

    <!-- 3 Telemetry Metric Cards -->
    <g transform="translate(0, 55)">
      <rect width="220" height="75" rx="6" fill="#FAFAF9" stroke="#E5E5E3"/>
      <text x="18" y="26" font-family="sans-serif" font-size="10" fill="#777777" letter-spacing="0.5">ENGINE STATUS / RPM</text>
      <text x="18" y="54" font-family="sans-serif" font-size="22" font-weight="700" fill="#171717">2,850 RPM</text>
      <text x="135" y="54" font-family="sans-serif" font-size="11" fill="#15803D">Optimal</text>

      <rect x="245" width="220" height="75" rx="6" fill="#FAFAF9" stroke="#E5E5E3"/>
      <text x="18" y="26" font-family="sans-serif" font-size="10" fill="#777777" letter-spacing="0.5">BATTERY VOLTAGE / HEALTH</text>
      <text x="18" y="54" font-family="sans-serif" font-size="22" font-weight="700" fill="#171717">12.6 V</text>
      <text x="110" y="54" font-family="sans-serif" font-size="11" fill="#15803D">98% Health</text>

      <rect x="490" width="220" height="75" rx="6" fill="#FAFAF9" stroke="#E5E5E3"/>
      <text x="18" y="26" font-family="sans-serif" font-size="10" fill="#777777" letter-spacing="0.5">DIAGNOSTIC TROUBLE CODES</text>
      <text x="18" y="54" font-family="sans-serif" font-size="22" font-weight="700" fill="#15803D">0 DTCs Active</text>
    </g>

    <!-- Trip & Route Analytics Panel -->
    <g transform="translate(0, 150)">
      <rect width="710" height="190" rx="6" fill="#FAFAF9" stroke="#E5E5E3"/>
      <text x="20" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#171717">Live Telemetry Feed &amp; Trip Log</text>

      <rect x="20" y="45" width="670" height="125" rx="4" fill="#FFFFFF" stroke="#E5E5E3"/>
      
      <!-- Table Header -->
      <rect x="20" y="45" width="670" height="28" fill="#F7F7F5" rx="4 4 0 0"/>
      <text x="35" y="63" font-family="sans-serif" font-size="10" font-weight="600" fill="#555555">TIMESTAMP</text>
      <text x="160" y="63" font-family="sans-serif" font-size="10" font-weight="600" fill="#555555">SPEED (KM/H)</text>
      <text x="290" y="63" font-family="sans-serif" font-size="10" font-weight="600" fill="#555555">COOLANT TEMP</text>
      <text x="430" y="63" font-family="sans-serif" font-size="10" font-weight="600" fill="#555555">FUEL EFFICIENCY</text>
      <text x="580" y="63" font-family="sans-serif" font-size="10" font-weight="600" fill="#555555">TELEMETRY LINK</text>

      <!-- Row 1 -->
      <line x1="20" y1="102" x2="690" y2="102" stroke="#EBEBEA"/>
      <text x="35" y="92" font-family="sans-serif" font-size="11" fill="#171717">14:40:12 UTC</text>
      <text x="160" y="92" font-family="sans-serif" font-size="11" font-weight="600" fill="#171717">64 km/h</text>
      <text x="290" y="92" font-family="sans-serif" font-size="11" fill="#171717">88°C (Normal)</text>
      <text x="430" y="92" font-family="sans-serif" font-size="11" fill="#15803D">18.4 km/L</text>
      <text x="580" y="92" font-family="sans-serif" font-size="10" fill="#2563EB">Socket Stream OK</text>

      <!-- Row 2 -->
      <text x="35" y="132" font-family="sans-serif" font-size="11" fill="#171717">14:39:55 UTC</text>
      <text x="160" y="132" font-family="sans-serif" font-size="11" font-weight="600" fill="#171717">58 km/h</text>
      <text x="290" y="132" font-family="sans-serif" font-size="11" fill="#171717">87°C (Normal)</text>
      <text x="430" y="132" font-family="sans-serif" font-size="11" fill="#15803D">19.1 km/L</text>
      <text x="580" y="132" font-family="sans-serif" font-size="10" fill="#2563EB">Socket Stream OK</text>
    </g>
  </g>
</svg>

