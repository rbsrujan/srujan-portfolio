<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <rect width="800" height="560" fill="#FAF9F5"/>
  <rect x="25" y="25" width="750" height="510" fill="#FFFFFF" stroke="#D8D6CE" stroke-width="2"/>
  <rect x="35" y="35" width="730" height="490" fill="none" stroke="#EAE8E0" stroke-width="1"/>

  <!-- NPTEL Header Bar -->
  <g transform="translate(60, 70)">
    <rect width="90" height="26" rx="4" fill="#8B4513" fill-opacity="0.1"/>
    <text x="45" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#8B4513" text-anchor="middle" letter-spacing="1">NPTEL</text>
    <text x="105" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#666666">National Programme on Technology Enhanced Learning</text>
  </g>

  <!-- Certificate Heading -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#171717">Certificate of Completion</text>
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#666666">This is to certify that</text>
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" fill="#171717">SRUJAN R B</text>
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#666666">has successfully completed the NPTEL online course</text>
    
    <!-- Course Title -->
    <rect x="0" y="115" width="680" height="56" rx="4" fill="#F7F7F5" stroke="#E5E5E3"/>
    <text x="24" y="150" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#171717">Responsible &amp; Safe AI Systems</text>
  </g>

  <!-- Footer Metadata & Badge -->
  <g transform="translate(60, 420)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#EAE8E0" stroke-width="1"/>
    
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#777777" uppercase tracking-wider>DURATION / TIMELINE</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#171717">July – December 2026</text>
    </g>

    <g transform="translate(240, 30)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#777777" uppercase tracking-wider>CERTIFICATION LEVEL</text>
      <rect x="0" y="7" width="105" height="24" rx="12" fill="#E8F5E9" stroke="#A5D6A7"/>
      <text x="52" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#2E7D32" text-anchor="middle">Completion</text>
    </g>

    <g transform="translate(520, 30)">
      <text x="160" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#777777" text-anchor="end" uppercase tracking-wider>ONLINE CERTIFICATION</text>
      <text x="160" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#555555" text-anchor="end">NPTEL &bull; IIT Madras / MOOC</text>
    </g>
  </g>
</svg>

