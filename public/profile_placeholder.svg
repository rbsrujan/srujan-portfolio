<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F2EE"/>
      <stop offset="100%" stop-color="#E5E5DE"/>
    </linearGradient>
  </defs>

  <!-- Clean portrait container -->
  <rect width="600" height="750" fill="url(#warmBg)"/>
  
  <!-- Subtle minimal framing border -->
  <rect x="24" y="24" width="552" height="702" fill="none" stroke="#D8D8D2" stroke-width="1.5"/>

  <!-- Minimal geometric monogram / portrait illustration -->
  <g transform="translate(300, 310)">
    <!-- Base silhouette circle -->
    <circle cx="0" cy="-30" r="110" fill="#E2E2DC" stroke="#D1D1C7" stroke-width="2"/>
    <circle cx="0" cy="-45" r="50" fill="#CECEC6"/>
    <path d="M-90,65 C-90,-10 90,-10 90,65 Z" fill="#CECEC6"/>

    <!-- Monogram overlay -->
    <circle cx="0" cy="-30" r="42" fill="#171717"/>
    <text x="0" y="-20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SRB</text>
  </g>

  <!-- Editorial Info Plate at bottom -->
  <g transform="translate(60, 520)">
    <rect width="480" height="150" rx="4" fill="#FFFFFF" stroke="#E5E5E3" stroke-width="1"/>
    
    <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#171717" letter-spacing="-0.5">SRUJAN RB</text>
    <text x="30" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#555555">Computer Science &amp; Engineering</text>
    <text x="30" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#777777">IIITDM Kancheepuram &bull; Chennai, India</text>
    
    <line x1="30" y1="106" x2="450" y2="106" stroke="#F0F0EE" stroke-width="1"/>
    <text x="30" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#4A5548">● Available for Software Engineering Roles &amp; Collaborations</text>
  </g>
</svg>

